name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: swift --version
      - name: Build app bundle (ad-hoc signed)
        run: SIGN_MODE=adhoc ./scripts/build-app.sh
      - name: Check the bundle
        run: |
          plutil -lint build/RawViewer.app/Contents/Info.plist
          codesign --verify --strict build/RawViewer.app
